<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="1120" height="800" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="1120" height="800" rx="14" fill="#f7f8fa"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#1b2330">Flydubai FZ1073 — Timeline</text>
  <text x="40" y="72" font-size="14" fill="#5b6574">Dubai (DXB) → Tel Aviv (TLV) · Wednesday, Sept 30, 2026 · times as reported, approximate</text>

  <!-- Panel A -->
  <text x="40" y="112" font-size="15" font-weight="700" fill="#c0392b">DAY OF THE INCIDENT</text>
  <line x1="70" y1="290" x2="1050" y2="290" stroke="#9aa4b2" stroke-width="4" stroke-linecap="round"/>

  <!-- A1 above -->
  <line x1="130" y1="215" x2="130" y2="290" stroke="#9aa4b2" stroke-width="2"/>
  <circle cx="130" cy="290" r="11" fill="#2c7be5"/>
  <rect x="25" y="125" width="210" height="90" rx="10" fill="#fff" stroke="#d5dae1"/>
  <text x="40" y="150" font-size="15" font-weight="700" fill="#2c7be5">~7:05 am</text>
  <text x="40" y="172" font-size="13" fill="#1b2330">Departs Dubai with ~172–174</text>
  <text x="40" y="190" font-size="13" fill="#1b2330">on board, mostly Israelis</text>

  <!-- A2 below -->
  <line x1="345" y1="290" x2="345" y2="345" stroke="#9aa4b2" stroke-width="2"/>
  <circle cx="345" cy="290" r="11" fill="#c0392b"/>
  <rect x="240" y="345" width="210" height="112" rx="10" fill="#fff" stroke="#e6b3ad"/>
  <text x="255" y="370" font-size="15" font-weight="700" fill="#c0392b">~2 h into flight</text>
  <text x="255" y="392" font-size="13" fill="#1b2330">Sudden dive: 14,000–17,000 ft</text>
  <text x="255" y="410" font-size="13" fill="#1b2330">in ~2 min. Co-pilot allegedly</text>
  <text x="255" y="428" font-size="13" fill="#1b2330">attacks captain with crash axe</text>

  <!-- A3 above -->
  <line x1="560" y1="215" x2="560" y2="290" stroke="#9aa4b2" stroke-width="2"/>
  <circle cx="560" cy="290" r="11" fill="#e67e22"/>
  <rect x="455" y="125" width="210" height="90" rx="10" fill="#fff" stroke="#d5dae1"/>
  <text x="470" y="150" font-size="15" font-weight="700" fill="#e67e22">Minutes later</text>
  <text x="470" y="172" font-size="13" fill="#1b2330">Captain unlocks cockpit door;</text>
  <text x="470" y="190" font-size="13" fill="#1b2330">crew &amp; passengers subdue him</text>

  <!-- A4 below -->
  <line x1="775" y1="290" x2="775" y2="345" stroke="#9aa4b2" stroke-width="2"/>
  <circle cx="775" cy="290" r="11" fill="#e67e22"/>
  <rect x="670" y="345" width="210" height="112" rx="10" fill="#fff" stroke="#d5dae1"/>
  <text x="685" y="370" font-size="15" font-weight="700" fill="#e67e22">Diversion</text>
  <text x="685" y="392" font-size="13" fill="#1b2330">Squawk 7500 (unlawful</text>
  <text x="685" y="410" font-size="13" fill="#1b2330">interference). Turns to Saudi;</text>
  <text x="685" y="428" font-size="13" fill="#1b2330">Israeli jets recalled</text>

  <!-- A5 above -->
  <line x1="990" y1="215" x2="990" y2="290" stroke="#9aa4b2" stroke-width="2"/>
  <circle cx="990" cy="290" r="11" fill="#27ae60"/>
  <rect x="885" y="125" width="210" height="90" rx="10" fill="#fff" stroke="#b9e0c8"/>
  <text x="900" y="150" font-size="15" font-weight="700" fill="#27ae60">~9:45 am (reported)</text>
  <text x="900" y="172" font-size="13" fill="#1b2330">Two off-duty pilots land at</text>
  <text x="900" y="190" font-size="13" fill="#1b2330">Tabuk, Saudi Arabia; arrest</text>

  <!-- Panel B -->
  <text x="40" y="505" font-size="15" font-weight="700" fill="#34495e">AFTERMATH</text>
  <line x1="70" y1="545" x2="1050" y2="545" stroke="#9aa4b2" stroke-width="4" stroke-linecap="round"/>

  <g font-size="13" fill="#1b2330">
    <line x1="130" y1="545" x2="130" y2="575" stroke="#9aa4b2" stroke-width="2"/>
    <circle cx="130" cy="545" r="10" fill="#34495e"/>
    <rect x="25" y="575" width="210" height="100" rx="10" fill="#fff" stroke="#d5dae1"/>
    <text x="40" y="600" font-size="15" font-weight="700" fill="#34495e">Oct 1</text>
    <text x="40" y="622">Suspect transferred to UAE</text>
    <text x="40" y="640">for questioning; Trump floats</text>
    <text x="40" y="658">unproven Iran link</text>

    <line x1="345" y1="545" x2="345" y2="575" stroke="#9aa4b2" stroke-width="2"/>
    <circle cx="345" cy="545" r="10" fill="#34495e"/>
    <rect x="240" y="575" width="210" height="100" rx="10" fill="#fff" stroke="#d5dae1"/>
    <text x="255" y="600" font-size="15" font-weight="700" fill="#34495e">Oct 2</text>
    <text x="255" y="622">Netanyahu: "Islamist radical</text>
    <text x="255" y="640">indoctrination"; probes if he</text>
    <text x="255" y="658">was sent by anyone</text>

    <line x1="560" y1="545" x2="560" y2="575" stroke="#9aa4b2" stroke-width="2"/>
    <circle cx="560" cy="545" r="10" fill="#34495e"/>
    <rect x="455" y="575" width="210" height="100" rx="10" fill="#fff" stroke="#d5dae1"/>
    <text x="470" y="600" font-size="15" font-weight="700" fill="#34495e">Oct 3</text>
    <text x="470" y="622">UAE attorney general calls it</text>
    <text x="470" y="640">a "terrorist operation";</text>
    <text x="470" y="658">Israel flights suspended</text>

    <line x1="775" y1="545" x2="775" y2="575" stroke="#9aa4b2" stroke-width="2"/>
    <circle cx="775" cy="545" r="10" fill="#34495e"/>
    <rect x="670" y="575" width="210" height="100" rx="10" fill="#fff" stroke="#d5dae1"/>
    <text x="685" y="600" font-size="15" font-weight="700" fill="#34495e">Oct 4</text>
    <text x="685" y="622">Israeli sources: likely acted</text>
    <text x="685" y="640">alone. Australia opens a</text>
    <text x="685" y="658">counter-terror probe</text>

    <line x1="990" y1="545" x2="990" y2="575" stroke="#9aa4b2" stroke-width="2"/>
    <circle cx="990" cy="545" r="10" fill="#34495e"/>
    <rect x="885" y="575" width="210" height="100" rx="10" fill="#fff" stroke="#d5dae1"/>
    <text x="900" y="600" font-size="15" font-weight="700" fill="#34495e">Oct 5–6</text>
    <text x="900" y="622">NZ police confirm flight</text>
    <text x="900" y="640">training there, Nov 2018 –</text>
    <text x="900" y="658">May 2019</text>
  </g>

  <text x="40" y="722" font-size="14" font-weight="700" fill="#27ae60">Deaths: none reported</text>
  <text x="40" y="744" font-size="13" fill="#5b6574">Injured: captain (axe wounds), one passenger (released), two crew (per Saudi authorities)</text>
  <text x="40" y="778" font-size="11" fill="#8a94a3">Sources: CBS News, Al Jazeera, CNN, Reuters, Arab News. Preliminary reporting; some details unconfirmed. Not an official flight-data plot.</text>
</svg>
